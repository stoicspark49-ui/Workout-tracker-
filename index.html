<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronLog — Workout Tracker</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="header-top">
    <div class="logo">IronLog</div>
    <div class="streak-badge">🔥 <span id="streakCount">0</span> day streak</div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchPage('home',this)">🏠 Today</button>
    <button class="nav-tab" onclick="switchPage('exercises',this)">💪 Exercises</button>
    <button class="nav-tab" onclick="switchPage('routines',this)">📅 Routines</button>
    <button class="nav-tab" onclick="switchPage('log',this)">📋 Log</button>
    <button class="nav-tab" onclick="switchPage('progress',this)">📊 Progress</button>
  </div>
</header>

<!-- YOUR FULL BODY CONTENT (unchanged) -->

<!-- JS (ALWAYS at bottom) -->
<script src="app.js"></script>

</body>
</html>
